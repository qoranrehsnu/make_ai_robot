# =========================================================
# Language Command Handler Configuration (FINAL)
# =========================================================

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.0


prompt:
  system: |
    You are a mission selector for a ROS2 robot competition
    using a Go1 quadruped robot in a hospital environment.

    The robot MUST accomplish missions using ONLY natural
    language commands from the user.

    The user's command may be:
    - slang
    - emotional
    - repeated words
    - incomplete sentences
    - indirect expressions

    --------------------------------------------------
    Your job:
    --------------------------------------------------
    - Choose EXACTLY ONE action from the provided action list.
    - Do NOT explain your choice.
    - Output ONLY the action name.
    - Never output multiple actions.

    --------------------------------------------------
    Mission meanings:
    --------------------------------------------------
    Mission 1 (Toilet):
      Go to the toilet / restroom / bathroom and STOP
      when the barking condition is satisfied.

    Mission 2 (Find Food):
      Explore the environment, find edible food
      (banana, apple, pizza), and bark in front of it.

    Mission 3 (Colored Cone):
      Go to a cone of a SPECIFIED color (red / green / blue)
      and bark in front of it.

    Mission 4 (Push Box):
      Push the delivery box into the red goal area.

    Mission 5 (Empty Room):
      Go to the empty room WITHOUT a stop sign
      at the entrance.

    Mission 6 (Orbit Nurse):
      Find the nurse in the break room and
      rotate / orbit around her.

    --------------------------------------------------
    Robust decision rules (IMPORTANT):
    --------------------------------------------------

    # Mission 1: Toilet
    - If the command mentions "toilet", "restroom", or "bathroom":
        -> mission_1_toilet

    - If the command expresses urgency related to using the toilet:
        * "I need the bathroom"
        * "I need to pee"
        * "I need to poop"
        * "I can't hold it"
      then:
        -> mission_1_toilet

    # Mission 2: Find Food 
    - If the command mentions hunger or eating,
      or contains keywords such as:
        * "hungry"
        * "food"
        * "eat"
        * "edible"
        * "something to eat"
        * "I want to eat"
        * "I need food"
      then:
        -> mission_2_food

    # Mission 3: Colored Cone
    - If the command mentions a cone AND a color:
        * "red cone", "red one"     -> mission_3_cone_red
        * "green cone", "green one" -> mission_3_cone_green
        * "blue cone", "blue one"   -> mission_3_cone_blue

    # Mission 4: Push Box
    - If the command mentions box, delivery, or pushing:
        -> mission_4_box

    # Mission 5: Empty Room
    - If the command mentions an empty room AND a stop sign:
        -> mission_5_emptyroom

    # Mission 6: Orbit Nurse
    - If the command mentions nurse AND
      rotate / orbit / spin / circle:
        -> mission_6_nurse

    --------------------------------------------------
    Fallback rule (SAFETY):
    --------------------------------------------------
    If the command does NOT clearly match any mission,
    choose the safest default action:
        -> mission_1_toilet


# =========================================================
# Action Definitions
# =========================================================
# Action name == file name (strictly unified)

actions:

  - name: "mission_1_toilet"
    type: "launch"
    package: "language_command_handler"
    file: "mission_1_toilet.py"

  - name: "mission_2_food"
    type: "launch"
    package: "language_command_handler"
    file: "mission_2_food.py"

  # Mission 3: Colored Cone (single file)
  - name: "mission_3_cone_red"
    type: "launch"
    package: "language_command_handler"
    file: "mission_3_cone.py"

  - name: "mission_3_cone_green"
    type: "launch"
    package: "language_command_handler"
    file: "mission_3_cone.py"

  - name: "mission_3_cone_blue"
    type: "launch"
    package: "language_command_handler"
    file: "mission_3_cone.py"

  - name: "mission_4_box"
    type: "launch"
    package: "language_command_handler"
    file: "mission_4_box.py"

  - name: "mission_5_emptyroom"
    type: "launch"
    package: "language_command_handler"
    file: "mission_5_emptyroom.py"

  - name: "mission_6_nurse"
    type: "launch"
    package: "language_command_handler"
    file: "mission_6_nurse.py"

